kv_cache_config:
  enable_block_reuse: false
  dtype: 'fp8'
  free_gpu_memory_fraction: 0.85
cuda_graph_config:
  max_batch_size: 64
sampler_type: TorchSampler
moe_config:
  backend: TRTLLM
attn_backend: "TRTLLM"
