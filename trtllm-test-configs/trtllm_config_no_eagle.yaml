max_batch_size: 64
max_num_tokens: 16384
max_seq_len: 163841
tensor_parallel_size: 1
moe_expert_parallel_size: 1
trust_remote_code: true
guided_decoding_backend: xgrammar
reasoning_parser: gpt_oss
stream_interval: 20
num_postprocess_workers: 4
